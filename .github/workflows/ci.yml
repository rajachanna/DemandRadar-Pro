name: DemandRadar Pro CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev]'
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Offline demonstration (synthetic only)
        run: python scripts/demo.py
      - name: Build wheel and check bundled UI
        run: |
          python -m build --wheel --no-isolation
          python - <<'PY'
          import glob, zipfile
          wheels = glob.glob('dist/*.whl')
          assert wheels, 'No wheel built'
          with zipfile.ZipFile(wheels[0]) as wheel:
              paths = wheel.namelist()
              for file in ('demandradar/static/index.html', 'demandradar/static/styles.css', 'demandradar/static/app.js'):
                  assert file in paths, file
          print('PASS: app assets packaged')
          PY
